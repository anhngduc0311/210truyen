services:
  postgres:
    image: postgres:17-alpine
    container_name: 210truyen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truyendex}
      POSTGRES_USER: ${POSTGRES_USER:-truyendex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-0F868F3B16B7DECCAE75B6E6B85D2C1DB1A845FB1A810833}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Cổng ngoài 54329 -> cổng trong 5432 (tránh trùng cổng mặc định 5432 của PostgreSQL)
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truyendex} -d ${POSTGRES_DB:-truyendex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - 210truyen-network

  redis:
    image: redis:7-alpine
    container_name: 210truyen-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-7B8A91F2C3D4E5A6B7C8D9E0F1A2B3C4}", "--appendonly", "yes"]
    ports:
      # Cổng ngoài 63799 -> cổng trong 6379 (tránh trùng cổng mặc định 6379 của Redis)
      - "${REDIS_PORT:-63799}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-7B8A91F2C3D4E5A6B7C8D9E0F1A2B3C4}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - 210truyen-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: 210truyen-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-truyendex_meili_master_key_8f93e5da4e928bfc}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      # Cổng ngoài 7709 -> cổng trong 7700 (tránh trùng cổng mặc định 7700 của Meilisearch)
      - "${MEILISEARCH_PORT:-7709}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - 210truyen-network

  api:
    build:
      context: ./backend/TruyenDex.Api
      dockerfile: Dockerfile
    container_name: 210truyen-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5080"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-truyendex};Username=${POSTGRES_USER:-truyendex};Password=${POSTGRES_PASSWORD:-0F868F3B16B7DECCAE75B6E6B85D2C1DB1A845FB1A810833}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-7B8A91F2C3D4E5A6B7C8D9E0F1A2B3C4},abortConnect=false"
      Meilisearch__Url: "http://meilisearch:7700"
      Meilisearch__ApiKey: "${MEILI_MASTER_KEY:-truyendex_meili_master_key_8f93e5da4e928bfc}"
      Jwt__Key: "${JWT_KEY:-0FD5CB907F85D4A39A8050488CEDB09B279939231E5A53BF9D636623E65EEA1A7EC97AE07988137FE4C52C0F5E54160A}"
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Google__DriveFolderId: "${GOOGLE_DRIVE_FOLDER_ID:-}"
      Google__RefreshToken: "${GOOGLE_DRIVE_REFRESH_TOKEN:-}"
    ports:
      - "${API_PORT:-5080}:5080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - 210truyen-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 210truyen-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - 210truyen-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local

networks:
  210truyen-network:
    driver: bridge
